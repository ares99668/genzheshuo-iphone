<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101316">
  <meta name="description" content="iPhone 自拍时按你的声音逐句提词。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="screen.css?v=2">
  <title>跟着说 · 自拍提词</title>
</head>
<body>
  <main id="editorScreen" class="editor">
    <header class="brand">
      <img src="icon.png" width="58" height="58" alt="">
      <div><h1>跟着说</h1><p>自拍提词</p></div>
    </header>
    <form id="openForm">
      <section class="paper" aria-label="话术编辑">
        <div class="paper-top">
          <label for="script">话术</label>
          <button id="importButton" class="quiet small" type="button">导入文件</button>
          <input id="importInput" type="file" accept=".txt,.docx,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
        </div>
        <textarea id="script" placeholder="把要说的话粘贴在这里" spellcheck="false" maxlength="100000"></textarea>
        <div class="paper-foot"><span id="scriptCount">0 字</span><span>保存在本机</span></div>
      </section>
      <p class="notice" id="editorNotice" role="status">自拍时台词叠在预览上，视频保存到本机。</p>
      <button id="openCamera" class="primary" type="submit">打开前置相机</button>
      <button id="lastVideo" class="quiet last-video" type="button" hidden>查看刚录的视频</button>
    </form>
  </main>

  <section id="cameraScreen" class="camera" aria-label="自拍录制" hidden>
    <video id="cameraVideo" autoplay muted playsinline disablepictureinpicture></video>
    <div class="camera-shading" aria-hidden="true"></div>
    <header class="camera-head">
      <button id="closeCamera" class="glass">返回话术</button>
      <span id="followState" class="status" role="status">正在打开相机…</span>
      <span id="counter" class="timer" aria-label="录制时长" hidden><i></i><span>00:00</span></span>
    </header>
    <div id="reader" class="reader" aria-label="当前台词">
      <div id="readStack" class="read-stack">
        <p id="previousCue" class="written previous"></p>
        <p id="readCue" class="written current"></p>
        <p id="nextCue" class="written next"></p>
        <p id="laterCue" class="written later"></p>
      </div>
      <button id="dragCue" class="drag" aria-label="拖动台词位置" title="拖动台词位置">⠿</button>
    </div>
    <footer class="camera-tools">
      <p id="cameraNote" class="camera-note" role="status"></p>
      <div class="control-row">
        <button id="first" class="glass">回开头</button>
        <button id="earlier" class="glass" aria-label="上一句">上句</button>
        <button id="followToggle" class="glass follow">暂停跟读</button>
        <button id="later" class="glass" aria-label="下一句">下句</button>
      </div>
      <div class="record-row">
        <button id="smaller" class="glass font-button" aria-label="缩小字号">A−</button>
        <button id="record" class="record" type="button" aria-label="开始录制">
          <span class="record-ring" aria-hidden="true"><span class="record-dot"></span></span>
          <span id="recordText" class="record-text">开始录制</span>
        </button>
        <button id="larger" class="glass font-button" aria-label="增大字号">A＋</button>
      </div>
      <p id="recordNotice" class="camera-note" role="status"></p>
    </footer>
  </section>

  <section id="reviewScreen" class="review" aria-label="录制预览" hidden>
    <div class="review-top"><h2>录制完成</h2><button id="doneReview" class="quiet">返回</button></div>
    <video id="resultVideo" controls playsinline preload="metadata"></video>
    <p id="resultNotice" class="notice" role="status">点「保存或分享」，可把视频保存到相册。</p>
    <div class="review-actions">
      <button id="shareVideo" class="primary">保存或分享</button>
      <a id="downloadVideo" class="quiet" download>下载文件</a>
    </div>
  </section>

  <script type="module" src="app.js?v=2"></script>
</body>
</html>
